<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[Site title]</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Lead owns this file. Teammates edit only their file in sections/. -->
  <header class="site-header">
    <a class="logo" href="#hero">[Site name]</a>
    <nav>
      <a href="#about">About</a>
      <a href="#features">Features</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <div data-include="sections/hero.html"></div>
    <div data-include="sections/about.html"></div>
    <div data-include="sections/features.html"></div>
    <div data-include="sections/contact.html"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Group 7</p>
  </footer>

  <script>
    // Loads each section file into the page. Needs a web server (use /preview), not file://.
    document.querySelectorAll('[data-include]').forEach(async (el) => {
      const path = el.dataset.include;
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error(res.status);
        el.outerHTML = await res.text();
      } catch (err) {
        el.innerHTML = `<p class="include-error">Couldn't load ${path}</p>`;
      }
    });
  </script>
</body>
</html>
